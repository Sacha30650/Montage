<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,800;1,800&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-cream: #fbf5ef;
        --brown-deep: #2a2520;
        --terracotta: #c56f4a;
        --sage: #87a878;
        --highlight: #f2c84b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#1a1410; font-family:"Plus Jakarta Sans",sans-serif; }
      .broll { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;  }
      .scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.7) 100%); pointer-events:none; }
      .caption {
        position:absolute; left:60px; right:60px; top:1100px;
        text-align:center; font-weight:800; line-height:1.05;
        color:var(--bg-cream);
        text-shadow:0 4px 24px rgba(0,0,0,0.85), 0 0 14px rgba(0,0,0,0.4);
        letter-spacing:-0.01em;
      }
      .hl-mark { background: rgba(242,200,75,0.55); padding:0 12px; border-radius:6px; color:var(--brown-deep); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <img class="clip broll" id="broll" data-start="0" data-duration="15" data-track-index="0" src="tests/hooks/images/N5-mysterious-door.png">
      <div class="clip scrim" id="scrim" data-start="0" data-duration="15" data-track-index="1"></div>

      <div class="clip caption" id="cap-N5-0" data-start="0.0" data-duration="1.98" data-track-index="3" style="font-size:92px; line-height:0.98;"><span class="hl-mark">L'erreur n°1</span></div>
      <div class="clip caption" id="cap-N5-1" data-start="2.0" data-duration="2.48" data-track-index="3" style="font-size:92px; line-height:0.98;">qui empêche ton bébé</div>
      <div class="clip caption" id="cap-N5-2" data-start="4.5" data-duration="2.00" data-track-index="3" style="font-size:92px; line-height:0.98;">de dormir…</div>
      <div class="clip caption" id="cap-N5-3" data-start="7.0" data-duration="8.00" data-track-index="3" style="font-size:92px; line-height:0.98;"><span class="hl-mark">…tu la fais ce soir.</span></div>

      <audio id="voiceover" class="clip" data-start="0" data-duration="15" data-track-index="10" data-volume="1.0" src="tests/hooks/audio/D.mp3"></audio>
      <audio id="music" class="clip" data-start="0" data-duration="15" data-track-index="11" data-volume="0.025" src="assets/audio/music-pad.mp3"></audio>
      <audio id="sfx-boom" class="clip" data-start="0" data-duration="0.55" data-track-index="12" data-volume="0.45" src="assets/audio/sfx/hook-boom.mp3"></audio>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#broll", { scale: 1.0 }, { scale: 1.10, duration: 15, ease: "none" }, 0);
      tl.from("#cap-N5-0", { y: 30, opacity: 0, duration: 0.3, ease: "power3.out" }, 0.0);
      tl.from("#cap-N5-1", { y: 30, opacity: 0, duration: 0.3, ease: "power3.out" }, 2.0);
      tl.from("#cap-N5-2", { y: 30, opacity: 0, duration: 0.3, ease: "power3.out" }, 4.5);
      tl.from("#cap-N5-3", { y: 30, opacity: 0, duration: 0.3, ease: "power3.out" }, 7.0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
