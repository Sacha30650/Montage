<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet" />
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#000; font-family:"Plus Jakarta Sans",sans-serif; }
      .videoclip { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
      .vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%); pointer-events:none; }
      .scrim-top { position:absolute; left:0; right:0; top:0; height:600px; background:linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 100%); pointer-events:none; }
      .scrim-bot { position:absolute; left:0; right:0; bottom:0; height:500px; background:linear-gradient(0deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 100%); pointer-events:none; }

      /* Hook captions — bold white outlined */
      .cap-hook {
        position:absolute; left:40px; right:40px; top:760px;
        text-align:center;
        font-weight:900;
        color:#ffffff;
        line-height:0.96;
        letter-spacing:-0.02em;
        text-shadow:
          4px 4px 0 #000, -4px -4px 0 #000,
          4px -4px 0 #000, -4px 4px 0 #000,
          0 4px 0 #000, 0 -4px 0 #000,
          4px 0 0 #000, -4px 0 0 #000,
          0 8px 24px rgba(0,0,0,0.85);
      }
      .cap-hook .line { display:block; }
      .cap-hook .yellow {
        background:#FFE600;
        color:#0a0a0a;
        padding:0 22px;
        margin:8px 0 0 0;
        display:inline-block;
        text-shadow:none;
        font-weight:900;
      }

      /* Outro logo card — exact match to original brand seal */
      .logo-card {
        position:absolute; left:40px; right:40px; top:720px;
        text-align:center;
      }
      .logo-card .brand {
        font-size:148px;
        font-weight:900;
        color:#ffffff;
        line-height:0.95;
        letter-spacing:-0.02em;
        text-shadow:0 4px 18px rgba(0,0,0,0.9);
      }
      .logo-card .underline {
        height:6px;
        background:#FFE600;
        width:80%;
        margin:16px auto 18px auto;
      }
      .logo-card .tagline {
        font-size:32px;
        font-weight:800;
        letter-spacing:0.40em;
        color:#ffffff;
        text-transform:uppercase;
      }
      .logo-card .sub {
        margin-top:50px;
        font-size:50px;
        font-weight:800;
        color:#ffffff;
        line-height:1.2;
      }

      /* Flash overlays */
      .flash-yellow { position:absolute; inset:0; background:#FFE600; mix-blend-mode:screen; }
      .flash-black  { position:absolute; inset:0; background:#000000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">

      <!-- Track 0: 8 sub-clips sequenced -->
      <video class="clip videoclip" id="v01a" data-start="0"    data-duration="0.7" data-track-index="0" muted src="pilots/teaser-fitnesspark/assets/clips/01a.mp4"></video>
      <video class="clip videoclip" id="v03a" data-start="0.7"  data-duration="0.8" data-track-index="0" muted src="pilots/teaser-fitnesspark/assets/clips/03a.mp4"></video>
      <video class="clip videoclip" id="v02a" data-start="1.5"  data-duration="1.1" data-track-index="0" muted src="pilots/teaser-fitnesspark/assets/clips/02a.mp4"></video>
      <video class="clip videoclip" id="v04a" data-start="2.6"  data-duration="1.1" data-track-index="0" muted src="pilots/teaser-fitnesspark/assets/clips/04a.mp4"></video>
      <video class="clip videoclip" id="v03b" data-start="3.7"  data-duration="1.0" data-track-index="0" muted src="pilots/teaser-fitnesspark/assets/clips/03b.mp4"></video>
      <video class="clip videoclip" id="v04b" data-start="4.7"  data-duration="1.09" data-track-index="0" muted src="pilots/teaser-fitnesspark/assets/clips/04b.mp4"></video>
      <video class="clip videoclip" id="v02b" data-start="5.8"  data-duration="1.2" data-track-index="0" muted src="pilots/teaser-fitnesspark/assets/clips/02b.mp4"></video>
      <video class="clip videoclip" id="v04c" data-start="7.0"  data-duration="1.0" data-track-index="0" muted src="pilots/teaser-fitnesspark/assets/clips/04c.mp4"></video>

      <!-- Track 1: vignette + scrims (always present) -->
      <div class="clip vignette" id="vignette"      data-start="0" data-duration="8" data-track-index="1"></div>

      <!-- Track 2: hook captions (4 phases, sequential = non-overlap) -->
      <div class="clip cap-hook" id="cap1" data-start="0.2" data-duration="2.40" data-track-index="2" style="font-size:140px;">
        <span class="line">QUELQUE CHOSE</span>
      </div>
      <div class="clip cap-hook" id="cap2" data-start="2.62" data-duration="2.07" data-track-index="2" style="font-size:128px;">
        <span class="line">QUELQUE CHOSE</span>
        <span class="line">SE PRÉPARE</span>
      </div>
      <div class="clip cap-hook" id="cap3" data-start="4.71" data-duration="1.07" data-track-index="2" style="font-size:120px;">
        <span class="line">DANS VOTRE</span>
      </div>
      <div class="clip cap-hook" id="cap4" data-start="5.80" data-duration="1.18" data-track-index="2" style="font-size:118px;">
        <span class="line">DANS VOTRE</span>
        <span class="line yellow" style="font-size:160px; margin-top:14px;">FITNESS PARK</span>
      </div>

      <!-- Track 3: outro logo card (no overlap with cap captions) -->
      <div class="clip logo-card" id="logo" data-start="7.00" data-duration="1.00" data-track-index="3">
        <div class="brand">FITNESS PARK</div>
        <div class="underline"></div>
        <div class="tagline">SE DÉPASSER · SE SURPASSER</div>
        <div class="sub">Restez connectés ⏳</div>
      </div>

      <!-- Track 4: flash overlays -->
      <div class="clip flash-yellow" id="flash-y1" data-start="1.50" data-duration="0.10" data-track-index="4" style="opacity:0.85;"></div>
      <div class="clip flash-black"  id="flash-b1" data-start="4.71" data-duration="0.07" data-track-index="4"></div>
      <div class="clip flash-yellow" id="flash-y2" data-start="5.80" data-duration="0.10" data-track-index="4" style="opacity:0.90;"></div>

      <!-- Audio -->
      <audio id="music"     class="clip" data-start="0" data-duration="8" data-track-index="10" data-volume="1.0" src="pilots/teaser-fitnesspark/assets/audio/music.mp3"></audio>
      <audio id="bass-drop-1" class="clip" data-start="0.0" data-duration="0.55" data-track-index="11" data-volume="0.45" src="pilots/teaser-fitnesspark/assets/audio/sfx/bass-drop.mp3"></audio>
      <audio id="bass-drop-2" class="clip" data-start="5.80" data-duration="0.55" data-track-index="12" data-volume="0.55" src="pilots/teaser-fitnesspark/assets/audio/sfx/bass-drop.mp3"></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // === ZOOM PUNCH on each video clip (scale 1.06 -> 1.0 at clip start) ===
      const punches = [
        ["#v01a", 0.0],
        ["#v03a", 0.7],
        ["#v02a", 1.5],
        ["#v04a", 2.6],
        ["#v03b", 3.7],
        ["#v04b", 4.7],
        ["#v02b", 5.8],
        ["#v04c", 7.0],
      ];
      punches.forEach(([sel, t]) => {
        tl.fromTo(sel, { scale: 1.08, x: 0 }, { scale: 1.00, duration: 0.30, ease: "power3.out" }, t);
      });

      // === SLOW KEN BURNS on each clip (subtle scale drift during its visible span) ===
      tl.to("#v01a", { scale: 1.00, duration: 0.7,  ease: "none" }, 0);
      tl.to("#v03a", { scale: 1.05, duration: 0.8,  ease: "power1.in" }, 0.7);
      tl.to("#v02a", { scale: 1.05, duration: 1.1,  ease: "power1.in" }, 1.5);
      tl.to("#v04a", { scale: 1.05, duration: 1.1,  ease: "power1.in" }, 2.6);
      tl.to("#v03b", { scale: 1.05, duration: 1.0,  ease: "power1.in" }, 3.7);
      tl.to("#v04b", { scale: 1.05, duration: 1.1,  ease: "power1.in" }, 4.7);
      tl.to("#v02b", { scale: 1.05, duration: 1.2,  ease: "power1.in" }, 5.8);
      tl.to("#v04c", { scale: 1.06, duration: 1.0,  ease: "power1.in" }, 7.0);

      // === CAPTION POPS — overshoot for dynamism ===
      // cap1 — "QUELQUE CHOSE" pop
      tl.from("#cap1", { y: 60, scale: 0.7, opacity: 0, duration: 0.30, ease: "back.out(2.2)" }, 0.2);

      // cap2 — add "SE PRÉPARE" beneath (whole block pops together)
      tl.from("#cap2", { y: 40, scale: 0.85, opacity: 0, duration: 0.28, ease: "back.out(2.0)" }, 2.62);

      // cap3 — "DANS VOTRE" appears (clean replace)
      tl.from("#cap3", { y: 50, scale: 0.85, opacity: 0, duration: 0.25, ease: "back.out(2.4)" }, 4.71);

      // cap4 — "DANS VOTRE / FITNESS PARK" reveal with bigger overshoot
      tl.from("#cap4", { y: 60, scale: 0.7, opacity: 0, duration: 0.35, ease: "back.out(2.8)" }, 5.80);

      // === OUTRO LOGO CARD — slide up + fade in ===
      tl.from("#logo", { y: 30, opacity: 0, duration: 0.40, ease: "power3.out" }, 7.00);

      // === FLASH overlays — opacity pulses for a quick blink ===
      tl.fromTo("#flash-y1", { opacity: 0 }, { opacity: 0.85, duration: 0.03, ease: "none" }, 1.50);
      tl.to("#flash-y1", { opacity: 0, duration: 0.07, ease: "power1.out" }, 1.53);

      tl.fromTo("#flash-b1", { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, 4.71);
      tl.to("#flash-b1", { opacity: 0, duration: 0.05, ease: "power1.out" }, 4.73);

      tl.fromTo("#flash-y2", { opacity: 0 }, { opacity: 0.90, duration: 0.04, ease: "none" }, 5.80);
      tl.to("#flash-y2", { opacity: 0, duration: 0.06, ease: "power1.out" }, 5.84);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
