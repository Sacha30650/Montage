<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --fp-red:  #e62029;
        --fp-black:#0a0a0a;
        --fp-white:#ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px;
        overflow: hidden; background: #000;
        font-family: "Anton", "Plus Jakarta Sans", sans-serif;
      }
      .broll {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
      }
      .vignette {
        position: absolute; inset: 0;
        background:
          linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 65%, rgba(0,0,0,0.85) 100%),
          radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.65) 100%);
        pointer-events: none;
      }
      .brand {
        position: absolute;
        top: 130px; left: 0; right: 0;
        text-align: center;
        font-family: "Anton", sans-serif;
        font-size: 96px;
        letter-spacing: 0.04em;
        color: var(--fp-white);
        text-shadow: 0 6px 30px rgba(0,0,0,0.85), 0 0 16px rgba(0,0,0,0.6);
      }
      .brand .fp {
        color: var(--fp-red);
        text-shadow: 0 6px 30px rgba(0,0,0,0.95), 0 0 14px rgba(230,32,41,0.65);
      }
      .flash {
        position: absolute; inset: 0;
        background: var(--fp-white);
        opacity: 0;
      }
      .reveal {
        position: absolute;
        inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 24px;
        text-align: center;
        font-family: "Anton", sans-serif;
        color: var(--fp-white);
        text-transform: uppercase;
      }
      .reveal .line1 {
        font-size: 170px;
        letter-spacing: 0.02em;
        line-height: 0.95;
        text-shadow: 0 10px 50px rgba(0,0,0,0.95);
      }
      .reveal .line2 {
        font-size: 200px;
        letter-spacing: 0.02em;
        line-height: 0.95;
        color: var(--fp-red);
        text-shadow:
          0 0 30px rgba(230,32,41,0.85),
          0 10px 60px rgba(0,0,0,0.95),
          4px 4px 0 rgba(0,0,0,0.55);
      }
      .reveal-bg {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.65), rgba(0,0,0,0.85));
      }
      .corner-mark {
        position: absolute;
        bottom: 220px; left: 0; right: 0;
        text-align: center;
        font-family: "Anton", sans-serif;
        font-size: 56px;
        letter-spacing: 0.16em;
        color: var(--fp-red);
        text-shadow: 0 4px 18px rgba(0,0,0,0.85);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">

      <!-- 4 clips beat-synced (each ~3s, total 12s) -->
      <video class="clip broll" id="broll-1" data-start="0"  data-duration="3" data-track-index="0" data-volume="0" muted src="assets/teaser/01.mp4"></video>
      <video class="clip broll" id="broll-2" data-start="3"  data-duration="3" data-track-index="0" data-volume="0" muted src="assets/teaser/02.mp4"></video>
      <video class="clip broll" id="broll-3" data-start="6"  data-duration="3" data-track-index="0" data-volume="0" muted src="assets/teaser/03.mp4"></video>
      <video class="clip broll" id="broll-4" data-start="9"  data-duration="3" data-track-index="0" data-volume="0" muted src="assets/teaser/04.mp4"></video>

      <!-- Speed-cut montage 12-15s: 0.75s each, back to first frame -->
      <video class="clip broll" id="broll-fast-1" data-start="12.00" data-duration="0.75" data-track-index="0" data-volume="0" muted src="assets/teaser/01.mp4"></video>
      <video class="clip broll" id="broll-fast-2" data-start="12.75" data-duration="0.75" data-track-index="0" data-volume="0" muted src="assets/teaser/02.mp4"></video>
      <video class="clip broll" id="broll-fast-3" data-start="13.50" data-duration="0.75" data-track-index="0" data-volume="0" muted src="assets/teaser/03.mp4"></video>
      <video class="clip broll" id="broll-fast-4" data-start="14.25" data-duration="0.75" data-track-index="0" data-volume="0" muted src="assets/teaser/04.mp4"></video>

      <!-- Reveal background (15-20s): hold on clip 04 -->
      <video class="clip broll" id="broll-reveal" data-start="15" data-duration="5" data-track-index="0" data-volume="0" muted src="assets/teaser/04.mp4"></video>

      <!-- Vignette overlay always -->
      <div class="clip vignette" id="vignette" data-start="0" data-duration="20" data-track-index="1"></div>

      <!-- Reveal dark overlay 15-20s -->
      <div class="clip reveal-bg" id="reveal-bg" data-start="15" data-duration="5" data-track-index="2"></div>

      <!-- White flash for impact at 15s -->
      <div class="clip flash" id="flash" data-start="14.85" data-duration="0.6" data-track-index="3"></div>

      <!-- Brand top text "FITNESS PARK" 0-12s -->
      <div class="clip brand" id="brand" data-start="0" data-duration="12" data-track-index="4">
        <span class="fp">FITNESS</span> PARK
      </div>

      <!-- Bottom small mark 0-12s -->
      <div class="clip corner-mark" id="corner-mark" data-start="0" data-duration="12" data-track-index="5">
        — UNE NOUVELLE ÈRE —
      </div>

      <!-- Final reveal 15-20s -->
      <div class="clip reveal" id="reveal" data-start="15" data-duration="5" data-track-index="6">
        <div class="line1">QUELQUE CHOSE</div>
        <div class="line2">SE PRÉPARE</div>
      </div>

      <!-- Audio: synth EDM beat -->
      <audio id="music" class="clip" data-start="0" data-duration="20" data-track-index="10" data-volume="0.65" src="assets/audio/workout-beat.mp3"></audio>

      <!-- SFX: hook impact + bass drop + whoosh on each cut -->
      <audio id="sfx-hook"  class="clip" data-start="0"     data-duration="0.55" data-track-index="11" data-volume="0.55" src="assets/audio/sfx/hook-boom.mp3"></audio>
      <audio id="sfx-w-a"   class="clip" data-start="2.55"  data-duration="0.62" data-track-index="11" data-volume="0.55" src="assets/audio/sfx/whoosh.mp3"></audio>
      <audio id="sfx-w-b"   class="clip" data-start="5.55"  data-duration="0.62" data-track-index="11" data-volume="0.55" src="assets/audio/sfx/whoosh.mp3"></audio>
      <audio id="sfx-w-c"   class="clip" data-start="8.55"  data-duration="0.62" data-track-index="11" data-volume="0.55" src="assets/audio/sfx/whoosh.mp3"></audio>
      <audio id="sfx-drop"  class="clip" data-start="14.85" data-duration="1.20" data-track-index="11" data-volume="0.95" src="assets/audio/sfx/bass-drop.mp3"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Brand text reveal: slide up + slight scale
      tl.from("#brand", { y: 80, opacity: 0, duration: 0.45, ease: "back.out(2)" }, 0);
      tl.from("#corner-mark", { y: -30, opacity: 0, duration: 0.45, ease: "power3.out" }, 0.2);
      tl.to("#brand", { opacity: 0, duration: 0.3 }, 11.7);
      tl.to("#corner-mark", { opacity: 0, duration: 0.3 }, 11.7);
      tl.set("#brand", { opacity: 0 }, 12);
      tl.set("#corner-mark", { opacity: 0 }, 12);

      // Punch zoom on each main clip (subtle motion)
      const mainClips = [
        ["#broll-1", 0,  3],
        ["#broll-2", 3,  3],
        ["#broll-3", 6,  3],
        ["#broll-4", 9,  3],
      ];
      mainClips.forEach(function (c, i) {
        var sel = c[0], t0 = c[1], dur = c[2];
        tl.fromTo(sel,
          { scale: 1.0, transformOrigin: "50% 50%" },
          { scale: 1.08, duration: dur, ease: "none" }, t0);
      });

      // Speed-cut clips: hard zoom-in
      ["#broll-fast-1","#broll-fast-2","#broll-fast-3","#broll-fast-4"].forEach(function (sel, i) {
        var t0 = 12 + i * 0.75;
        tl.fromTo(sel,
          { scale: 1.15 },
          { scale: 1.20, duration: 0.75, ease: "none" }, t0);
      });

      // Flash impact at 15s: short white blast
      tl.fromTo("#flash",
        { opacity: 0 },
        { opacity: 0.95, duration: 0.08, ease: "power2.in" }, 14.85);
      tl.to("#flash",
        { opacity: 0, duration: 0.45, ease: "power2.out" }, 14.93);
      tl.set("#flash", { opacity: 0 }, 15.45);

      // Reveal text: scale + bounce in, hold, slight breathe
      tl.fromTo("#reveal .line1",
        { scale: 0.6, opacity: 0, y: 30 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.55, ease: "back.out(2.5)" }, 14.95);
      tl.fromTo("#reveal .line2",
        { scale: 0.5, opacity: 0, y: 40, rotate: -2 },
        { scale: 1.0, opacity: 1, y: 0, rotate: 0, duration: 0.65, ease: "back.out(2.2)" }, 15.20);
      // Breathe (subtle scale pulse)
      tl.to("#reveal .line2",
        { scale: 1.05, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 16.0);
      // Reveal background slow zoom on broll-reveal
      tl.fromTo("#broll-reveal",
        { scale: 1.0 },
        { scale: 1.12, duration: 5, ease: "none" }, 15);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
